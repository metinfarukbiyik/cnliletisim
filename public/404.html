<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sayfa bulunamadı — CNL İletişim</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#fdfdfe" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,500;0,800;1,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fdfdfe; --panel: #ffffff; --panel-soft: #f5f8fe; --ink: #0b2b86; --ink-strong: #00238a;
      --ink-body: #2f4d8e; --ink-muted: #5d6f95; --line: #dfe7f4; --line-strong: #b5c8e7;
      --grid: rgba(31, 95, 224, 0.055); --primary: #003ca8; --primary-hover: #0b3aa8; --on-primary: #fff;
      --blue: #1f6fe8; --amber: #f8b900; --red: #e04b55; --shadow: rgba(141, 154, 179, 0.28);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020; --panel: #0f1730; --panel-soft: #121c3a; --ink: #c9d8ff; --ink-strong: #e6edff;
        --ink-body: #a9bce6; --ink-muted: #8195c4; --line: #1e2b52; --line-strong: #2d3f72;
        --grid: rgba(120, 160, 255, 0.05); --primary: #3a7bff; --primary-hover: #5a90ff;
        --blue: #5a9bff; --amber: #ffc83d; --red: #ff6b74; --shadow: rgba(0, 0, 0, 0.45);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink-body);
      font: 400 16px/1.6 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .ust { max-width: 1100px; width: 100%; margin: 0 auto; padding: 20px 16px; }
    .logo { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-ad { font: 800 19px/1 "JetBrains Mono", monospace; letter-spacing: .085em; color: var(--ink-strong); white-space: nowrap; }
    .logo-ad em { color: var(--primary); }
    .logo-alt { margin-top: 4px; font: 500 10.5px/1 "JetBrains Mono", monospace; letter-spacing: .16em; color: var(--ink-muted); white-space: nowrap; }
    main { flex: 1; display: grid; place-items: center; padding: 24px 16px 56px; }
    .kart { width: 100%; max-width: 560px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 40px 28px 32px; box-shadow: 0 12px 40px var(--shadow); }
    .kule { width: 112px; height: 112px; margin: 0 auto 8px; display: block; }
    .kule .halka { transform-origin: 56px 34px; animation: sonum 2.4s ease-out infinite; }
    .kule .halka.iki { animation-delay: 1.2s; }
    @keyframes sonum { 0% { opacity: .9; transform: scale(.4); } 80%, 100% { opacity: 0; transform: scale(1.6); } }
    @media (prefers-reduced-motion: reduce) { .kule .halka { animation: none; opacity: .35; } }
    .kod { margin: 0; font: italic 800 clamp(64px, 16vw, 96px)/1 "JetBrains Mono", monospace; letter-spacing: -.04em; color: var(--ink-strong); }
    .kod span { color: var(--primary); }
    .etiket { display: inline-block; margin-top: 10px; font: 700 12px/1 "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
    h1 { margin: 14px 0 8px; font: 600 22px/1.3 "IBM Plex Sans", sans-serif; color: var(--ink-strong); }
    p { margin: 0 auto; max-width: 420px; color: var(--ink-muted); }
    .adres { display: inline-block; max-width: 100%; margin-top: 14px; padding: 6px 10px; border-radius: 8px; background: var(--panel-soft); border: 1px solid var(--line); font: 500 13px/1.4 "JetBrains Mono", monospace; color: var(--ink); overflow-wrap: anywhere; }
    .adres:empty { display: none; }
    .dugmeler { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px; }
    .dugme { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; text-decoration: none; font: 600 15px/1 "IBM Plex Sans", sans-serif; border: 1px solid var(--line-strong); color: var(--ink); background: var(--panel); transition: background .15s, border-color .15s; }
    .dugme:hover { border-color: var(--primary); }
    .dugme.ana { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .dugme.ana:hover { background: var(--primary-hover); }
    .dugme:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
    .dugme svg { width: 18px; height: 18px; flex: none; }
    footer { padding: 0 16px 24px; text-align: center; font-size: 13px; color: var(--ink-muted); }
    @media (max-width: 480px) { .kart { padding: 32px 18px 24px; } .dugme { flex: 1 1 100%; } }
  </style>
</head>
<body>
  <div class="ust">
    <a class="logo" href="/" aria-label="CNL İletişim ana sayfa">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="2" fill="var(--panel)" stroke="var(--line-strong)" stroke-width="1.5" />
        <path d="M20 14 L13 33 M20 14 L27 33 M15.3 27 H24.7 M16.8 22 H23.2" stroke="var(--ink-strong)" stroke-width="2" stroke-linecap="round" fill="none" />
        <circle cx="20" cy="13" r="2.6" fill="var(--amber)" stroke="var(--ink-strong)" stroke-width="1.2" />
      </svg>
      <span><span class="logo-ad">CNL <em>İLETİŞİM</em></span><span class="logo-alt" style="display:block">BASE STATION SOLUTIONS</span></span>
    </a>
  </div>

  <main>
    <section class="kart" aria-labelledby="baslik">
      <svg class="kule" viewBox="0 0 112 112" aria-hidden="true">
        <circle class="halka" cx="56" cy="34" r="14" fill="none" stroke="var(--blue)" stroke-width="2" />
        <circle class="halka iki" cx="56" cy="34" r="14" fill="none" stroke="var(--blue)" stroke-width="2" />
        <path d="M56 38 L38 96 M56 38 L74 96 M44 78 H68 M48 62 H64" stroke="var(--ink-strong)" stroke-width="4" stroke-linecap="round" fill="none" />
        <circle cx="56" cy="34" r="7" fill="var(--amber)" stroke="var(--ink-strong)" stroke-width="2.5" />
        <path d="M80 18 L94 32 M94 18 L80 32" stroke="var(--red)" stroke-width="4" stroke-linecap="round" />
      </svg>
      <p class="kod">4<span>0</span>4</p>
      <span class="etiket">Sinyal yok</span>
      <h1 id="baslik">Aradığınız sayfa bulunamadı</h1>
      <p>Adres yanlış yazılmış, sayfa taşınmış ya da kaldırılmış olabilir. Aşağıdaki bağlantılardan devam edebilirsiniz.</p>
      <code class="adres" id="adres"></code>
      <nav class="dugmeler" aria-label="Devam et">
        <a class="dugme ana" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
          Ana sayfa
        </a>
        <a class="dugme" href="/#services">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          Hizmetler
        </a>
        <a class="dugme" href="/#contact">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM4 6l8 7 8-7"/></svg>
          İletişim
        </a>
      </nav>
    </section>
  </main>

  <footer>© CNL İletişim Elektrik ve Elektronik</footer>
  <script>
    // İstenen adresi gösterir; metin olarak yazıldığı için içerik yorumlanmaz.
    var adres = location.pathname + location.search;
    try { adres = decodeURI(adres); } catch (e) { /* bozuk kodlama: olduğu gibi göster */ }
    document.getElementById('adres').textContent = adres.slice(0, 200);
  </script>
</body>
</html>
